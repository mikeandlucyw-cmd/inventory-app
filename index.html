<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<title>My Inventory</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;display:flex;flex-direction:column}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:rgba(255,255,255,.55);font-size:.88rem;letter-spacing:.02em}

/* ── Error ── */
#error-screen{display:none;position:fixed;inset:0;background:#f0f2f5;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:998}
#error-screen.show{display:flex}
#error-screen h2{font-size:1.1rem;margin-bottom:8px}
#error-screen p{color:#64748b;font-size:.88rem;margin-bottom:24px;line-height:1.6}
.btn-primary{padding:11px 28px;background:#4f8ef7;color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100%;opacity:0;transition:opacity .35s}
#app.show{opacity:1}

/* ── Header ── */
.header{background:#1a1a2e;flex-shrink:0;padding-top:env(safe-area-inset-top,0)}
.header-inner{display:flex;align-items:center;padding:13px 16px;gap:10px;min-height:52px}
#back-btn{background:none;border:none;color:rgba(255,255,255,.75);font-size:.88rem;cursor:pointer;display:none;align-items:center;gap:4px;white-space:nowrap;padding:4px 0;flex-shrink:0}
#back-btn.show{display:flex}
#back-btn:active{color:#fff}
.header-titles{flex:1;min-width:0}
#header-title{color:#fff;font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header-subtitle{color:rgba(255,255,255,.45);font-size:.72rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Bottom nav ── */
.nav{background:#fff;border-top:1px solid #e8ecf0;display:flex;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 8px 10px;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:.7rem;font-weight:500;gap:3px;transition:color .15s}
.nav-btn.active{color:#4f8ef7}
.nav-icon{font-size:1.3rem;line-height:1}

/* ── Views ── */
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-pad{padding:14px 14px 32px}

/* ── Cards ── */
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.04);margin-bottom:10px;overflow:hidden;transition:transform .12s,box-shadow .12s;cursor:pointer}
.card:active{transform:scale(.985);box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* ── Box cards ── */
.box-card{padding:15px 16px}
.box-card-row{display:flex;justify-content:space-between;align-items:flex-start}
.box-id{font-size:1rem;font-weight:700;color:#1a1a2e}
.box-chevron{color:#c0cad8;font-size:1.1rem;margin-top:1px}
.box-meta{font-size:.8rem;color:#64748b;margin-top:3px;line-height:1.5}
.box-pill{display:inline-flex;align-items:center;background:#eef2ff;color:#4338ca;border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:700;margin-top:9px}

/* ── Item cards ── */
.item-card{display:flex;gap:11px;align-items:flex-start;padding:13px 14px}
.item-img{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#f0f2f5;flex-shrink:0;cursor:pointer}
.item-img-ph{width:58px;height:58px;border-radius:9px;background:#f0f2f5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#cbd5e1}
.item-body{flex:1;min-width:0}
.item-name{font-size:.9rem;font-weight:600;color:#1a1a2e;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-detail{font-size:.78rem;color:#64748b;line-height:1.65}
.item-value{font-size:.78rem;color:#16a34a;font-weight:700;margin-top:2px}
.item-date{font-size:.7rem;color:#a0aec0;margin-top:1px}

/* ── Badge ── */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.62rem;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}

/* ── Box detail ── */
.box-meta-block{background:#fff;border-bottom:1px solid #f0f2f5;padding:13px 16px;font-size:.82rem;color:#64748b;line-height:1.9}
.box-meta-block strong{color:#334155;font-weight:600}
.gallery-wrap{background:#fff;border-bottom:1px solid #f0f2f5;padding:12px 14px}
.gallery{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.gallery::-webkit-scrollbar{display:none}
.gal-img{width:88px;height:70px;border-radius:9px;object-fit:cover;flex-shrink:0;cursor:pointer;transition:transform .18s,opacity .18s}
.gal-img:active{transform:scale(.94)}
.items-wrap{padding:12px 14px 32px}

/* ── Search ── */
.search-sticky{position:sticky;top:0;background:#f0f2f5;padding:12px 14px 6px;z-index:10}
.search-box{position:relative}
.search-box input{width:100%;padding:10px 14px 10px 38px;background:#fff;border:1.5px solid #e2e8f0;border-radius:11px;font-size:.92rem;color:#1a1a2e;-webkit-appearance:none;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.search-box input:focus{outline:none;border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.12)}
.search-box::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none}
.count-bar{font-size:.8rem;color:#94a3b8;padding:6px 14px 2px}
.count-bar strong{color:#334155}

/* ── Search result card ── */
.result-card{display:flex;align-items:center;padding:13px 14px;gap:10px}
.result-body{flex:1;min-width:0}
.result-link{color:#4f8ef7;font-size:.78rem;font-weight:700;white-space:nowrap;flex-shrink:0;cursor:pointer;padding:4px 0}
.result-link:active{opacity:.7}

/* ── Empty state ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;color:#94a3b8}
.empty-icon{font-size:2.8rem;margin-bottom:14px}
.empty p{font-size:.88rem;line-height:1.6}

/* ── Lightbox ── */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;padding:16px}
#lightbox.open{display:flex}
#lb-img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain}
#lb-close{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.12);border:none;color:#fff;font-size:1.3rem;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
#lb-close:active{background:rgba(255,255,255,.25)}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p>Loading inventory…</p>
</div>

<!-- Error -->
<div id="error-screen">
  <div class="empty-icon">⚠️</div>
  <h2>Could not load inventory</h2>
  <p id="error-msg">Check your connection and try again.</p>
  <button class="btn-primary" onclick="loadData()">Try again</button>
</div>

<!-- App -->
<div id="app">

  <div class="header">
    <div class="header-inner">
      <button id="back-btn" onclick="goBack()">‹ Back</button>
      <div class="header-titles">
        <div id="header-title">My Inventory</div>
        <div id="header-subtitle"></div>
      </div>
    </div>
  </div>

  <!-- Browse -->
  <div class="view active" id="view-browse">
    <div class="scroll">
      <div class="scroll-pad" id="boxes-list"></div>
    </div>
  </div>

  <!-- Box detail -->
  <div class="view" id="view-box">
    <div class="scroll" id="box-scroll">
      <div id="box-content"></div>
    </div>
  </div>

  <!-- Search -->
  <div class="view" id="view-search">
    <div class="scroll">
      <div class="search-sticky">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="Search items, brands, categories…" autocomplete="off" autocorrect="off" autocapitalize="off">
        </div>
      </div>
      <div class="count-bar" id="search-count"></div>
      <div style="padding:4px 14px 32px" id="search-results"></div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-browse" onclick="switchTab('browse')">
      <span class="nav-icon">📦</span>Browse
    </button>
    <button class="nav-btn" id="nav-search" onclick="switchTab('search')">
      <span class="nav-icon">🔍</span>Search
    </button>
  </nav>

</div>

<!-- Lightbox -->
<div id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — do not change this URL
// ─────────────────────────────────────────────────────────────────────────────
const DATA_URL = 'https://script.google.com/macros/s/AKfycbwW2ZLQj5EGXARJT0d-ThtPRJLhHXj0B-ekqrqlLWIU0PPO6Ik9TfIqr1a1cmkGs8QG/exec?view=data';

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const S = { boxes: [], tools: [], tab: 'browse', box: null };

// ─────────────────────────────────────────────────────────────────────────────
// CATEGORY COLOURS
// ─────────────────────────────────────────────────────────────────────────────
const COLOURS = {
  'tool':'#1565c0','shoes':'#7c3aed','clothing':'#be185d','bag':'#b45309',
  'luggage':'#92400e','toy':'#ea580c','book':'#0369a1','media':'#0284c7',
  'kitchenware':'#15803d','tableware':'#166534','small appliance':'#0e7490',
  'electronics':'#0e7490','cable':'#475569','office':'#4338ca','sports':'#dc2626',
  'hobby':'#7e22ce','decoration':'#c2410c','document':'#64748b',
  'container':'#334155','other':'#64748b'
};
const colour = cat => COLOURS[(cat||'').toLowerCase()] || '#64748b';

// ─────────────────────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────────────────────
async function loadData() {
  el('loading').classList.remove('hide');
  el('error-screen').classList.remove('show');
  el('app').classList.remove('show');
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    S.boxes = data.boxes || [];
    S.tools = data.tools || [];
    renderBrowse();
    renderSearch();
    el('loading').classList.add('hide');
    el('app').classList.add('show');
  } catch (err) {
    el('loading').classList.add('hide');
    el('error-msg').textContent = err.message || 'Unknown error.';
    el('error-screen').classList.add('show');
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  S.tab = tab; S.box = null;
  qAll('.view').forEach(v => v.classList.remove('active'));
  qAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el('view-' + tab).classList.add('active');
  el('nav-' + tab).classList.add('active');
  el('header-title').textContent = tab === 'search' ? 'Search' : 'My Inventory';
  el('header-subtitle').textContent = '';
  el('back-btn').classList.remove('show');
}

function openBox(boxId) {
  S.box = boxId;
  const box = S.boxes.find(b => b.id === boxId) || { id: boxId };
  el('header-title').textContent = boxId;
  const sub = [box.storageType, box.collection, box.location].filter(Boolean).join(' · ');
  el('header-subtitle').textContent = sub;
  el('back-btn').classList.add('show');
  qAll('.view').forEach(v => v.classList.remove('active'));
  el('view-box').classList.add('active');
  el('box-scroll').scrollTop = 0;
  renderBoxDetail(boxId);
}

function goToBox(boxId) {
  S.tab = 'browse';
  qAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el('nav-browse').classList.add('active');
  openBox(boxId);
}

function goBack() {
  S.box = null;
  qAll('.view').forEach(v => v.classList.remove('active'));
  qAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el('view-' + S.tab).classList.add('active');
  el('nav-' + S.tab).classList.add('active');
  el('header-title').textContent = S.tab === 'search' ? 'Search' : 'My Inventory';
  el('header-subtitle').textContent = '';
  el('back-btn').classList.remove('show');
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER: BROWSE
// ─────────────────────────────────────────────────────────────────────────────
function renderBrowse() {
  const wrap = el('boxes-list');
  if (!S.boxes.length) {
    wrap.innerHTML = empty('📦', 'No storage units found.');
    return;
  }
  wrap.innerHTML = S.boxes.map(box => {
    const meta = [box.storageType, box.collection, box.location].filter(Boolean).join(' · ');
    const desc = box.description ? '<div style="margin-top:2px">' + x(box.description) + '</div>' : '';
    return '<div class="card box-card" onclick="openBox(\'' + x(box.id) + '\')">'
      + '<div class="box-card-row"><div class="box-id">' + x(box.id) + '</div><div class="box-chevron">›</div></div>'
      + (meta ? '<div class="box-meta">' + x(meta) + '</div>' : '')
      + desc
      + '<div class="box-pill">' + box.itemCount + ' item' + (box.itemCount === 1 ? '' : 's') + '</div>'
      + '</div>';
  }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER: BOX DETAIL
// ─────────────────────────────────────────────────────────────────────────────
function renderBoxDetail(boxId) {
  const box   = S.boxes.find(b => b.id === boxId) || {};
  const items = S.tools.filter(t => t.storageId === boxId);
  let html    = '';

  // Metadata block
  const rows = [];
  if (box.storageType) rows.push('<strong>Type</strong>&ensp;' + x(box.storageType));
  if (box.collection)  rows.push('<strong>Collection</strong>&ensp;' + x(box.collection));
  if (box.location)    rows.push('<strong>Location</strong>&ensp;' + x(box.location));
  if (box.description) rows.push('<strong>Notes</strong>&ensp;' + x(box.description));
  if (rows.length) {
    html += '<div class="box-meta-block">' + rows.map(r => '<div>' + r + '</div>').join('') + '</div>';
  }

  // Image gallery — unique URLs only
  const seen = {}; const imgs = [];
  items.forEach(item => { if (item.imageUrl && !seen[item.imageUrl]) { imgs.push(item.imageUrl); seen[item.imageUrl] = true; } });
  if (imgs.length) {
    html += '<div class="gallery-wrap"><div class="gallery">'
      + imgs.map(url => '<img class="gal-img" src="' + url + '" onerror="this.style.display=\'none\'" onclick="openLightbox(\'' + url + '\')" loading="lazy">').join('')
      + '</div></div>';
  }

  // Items
  if (!items.length) {
    html += '<div class="items-wrap">' + empty('📋', 'No items recorded yet.') + '</div>';
  } else {
    html += '<div class="items-wrap">' + items.map(itemCard).join('') + '</div>';
  }

  el('box-content').innerHTML = html;
}

function itemCard(item) {
  const c   = colour(item.category);
  const img = item.imageUrl
    ? '<img class="item-img" src="' + item.imageUrl + '" onerror="this.style.display=\'none\'" onclick="openLightbox(\'' + item.imageUrl + '\');event.stopPropagation()" loading="lazy">'
    : '<div class="item-img-ph">📷</div>';
  const meta = [item.brand, item.size, item.condition].filter(Boolean).map(x).join(' · ');
  const val  = item.estValue ? '<div class="item-value">Est. £' + Number(item.estValue).toFixed(2) + '</div>' : '';
  const date = item.lastSeen ? '<div class="item-date">' + fmtDate(item.lastSeen) + '</div>' : '';
  return '<div class="card item-card">'
    + img
    + '<div class="item-body">'
    + '<div class="badge" style="background:' + c + '">' + x(item.category || 'Other') + '</div>'
    + '<div class="item-name">' + x(item.name) + '</div>'
    + (meta ? '<div class="item-detail">' + meta + '</div>' : '')
    + val + date
    + '</div></div>';
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER: SEARCH
// ─────────────────────────────────────────────────────────────────────────────
function renderSearch() {
  const wrap = el('search-results');
  el('search-count').innerHTML = '<strong>' + S.tools.length + '</strong> items';
  if (!S.tools.length) { wrap.innerHTML = empty('🔍', 'No items yet.'); return; }
  wrap.innerHTML = S.tools.map(item => {
    const c    = colour(item.category);
    const loc  = [item.storageId, item.location].filter(Boolean).map(x).join(' · ');
    const meta = [item.brand, item.condition].filter(Boolean).map(x).join(' · ');
    const srch = (item.name + ' ' + item.category + ' ' + item.brand + ' ' + item.storageId + ' ' + item.collection + ' ' + item.location).toLowerCase();
    return '<div class="card result-card" data-s="' + x(srch) + '">'
      + '<div class="result-body">'
      + '<div class="badge" style="background:' + c + '">' + x(item.category || 'Other') + '</div>'
      + '<div class="item-name">' + x(item.name) + '</div>'
      + (loc  ? '<div class="item-detail">' + loc  + '</div>' : '')
      + (meta ? '<div class="item-detail">' + meta + '</div>' : '')
      + '</div>'
      + (item.storageId ? '<div class="result-link" onclick="goToBox(\'' + x(item.storageId) + '\')">→ ' + x(item.storageId) + '</div>' : '')
      + '</div>';
  }).join('');
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
const el    = id => document.getElementById(id);
const qAll  = sel => document.querySelectorAll(sel);
const empty = (icon, msg) => '<div class="empty"><div class="empty-icon">' + icon + '</div><p>' + msg + '</p></div>';

function x(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmtDate(v) {
  if (!v) return '';
  try {
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  } catch(e) { return String(v); }
}

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────────────────────────────────────
function openLightbox(url) { el('lb-img').src = url; el('lightbox').classList.add('open'); }
function closeLightbox()   { el('lightbox').classList.remove('open'); }

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
loadData();

// Attach search listener after DOM is ready
var st;
document.addEventListener('DOMContentLoaded', function() {
  var inp = el('search-input');
  if (inp) {
    inp.addEventListener('input', function() {
      clearTimeout(st);
      st = setTimeout(function() {
        var f = inp.value.toLowerCase().trim();
        var cards = qAll('#search-results .card');
        var n = 0;
        cards.forEach(function(c) { var m = !f || c.dataset.s.includes(f); c.style.display = m ? '' : 'none'; if (m) n++; });
        el('search-count').innerHTML = '<strong>' + n + '</strong> item' + (n === 1 ? '' : 's') + (f ? ' matching' : '');
      }, 120);
    });
  }
});
</script>
</body>
</html>
